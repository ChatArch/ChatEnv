name: Preview Docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[docs]
      - name: Deploy dev docs
        env:
          CHATARCH_PREVIEW_URL: https://arch.gh.wzhecnu.cn/${{ github.event.repository.name }}/dev/
        run: |
          git fetch origin
          mike deploy dev -p --allow-empty
          echo "Preview URL: ${CHATARCH_PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with Preview Link
        uses: actions/github-script@v7
        with:
          script: |
            const { payload } = context;
            const marker = '<!-- chatarch-pages-preview -->';
            const previewLink = `https://arch.gh.wzhecnu.cn/${context.repo.repo}/dev/`;
            const body = `${marker}\nPreview available at: ${previewLink}`;
            const comments = await github.rest.issues.listComments({
              issue_number: payload.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existingComment = comments.data.find(comment => comment.body.includes(marker));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: payload.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
